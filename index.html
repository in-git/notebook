<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吴文龙的便签</title>
    <!-- Quill.js 富文本编辑器 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* 保留部分 Quill 的必要样式重写及滚动条、动画 */
        .ql-toolbar.ql-snow {
            border: none !important;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 0.75rem;
            padding: 10px 12px;
            margin-bottom: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .ql-container.ql-snow {
            border: none !important;
            flex: 1;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 16px;
            color: #1d1d1f;
            overflow-y: auto;
        }

        .ql-editor {
            padding: 0;
            line-height: 1.7;
        }

        .ql-editor.ql-blank::before {
            color: #c7c7cc;
            font-style: normal;
            left: 0;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.8);
                opacity: 0.5;
            }

            100% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .ai-loading-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #0071e3;
            border-radius: 50%;
            animation: pulse 1s infinite alternate;
        }

        /* AI 状态小圆点 */
        #ai-dot {
            transition: background-color 0.3s ease;
        }

        #ai-dot.ai-loading-dot {
            width: 6px;
            height: 6px;
            background: #0071e3;
            animation: pulse 1s infinite alternate;
        }

        /* AI 总结按钮 loading 旋转动画 */
        @keyframes aiSpin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .ai-btn-loading svg {
            animation: aiSpin 1s linear infinite;
        }

        .ai-btn-loading {
            opacity: 0.7;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* 标题 loading 骨架屏闪烁 */
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }

        .title-shimmer {
            background: linear-gradient(90deg, transparent 30%, rgba(99, 102, 241, 0.08) 50%, transparent 70%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 6px;
        }

        /* 拖拽排序样式 */
        .note-item-dragging {
            opacity: 0.4 !important;
            transform: scale(0.97);
        }

        .note-drop-indicator {
            height: 3px;
            background: #0071e3;
            border-radius: 2px;
            margin: -1px 0;
            pointer-events: none;
            animation: dropIndicatorPulse 0.8s ease-in-out infinite alternate;
        }

        @keyframes dropIndicatorPulse {
            0% {
                opacity: 0.6;
            }

            100% {
                opacity: 1;
            }
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body
    class="bg-[linear-gradient(135deg,#f5f7fa_0%,#e4e8f0_100%)] h-screen w-screen flex overflow-hidden text-[#1d1d1f] antialiased">

    <div class="w-screen h-screen bg-[rgba(255,255,255,0.85)] backdrop-blur-[40px] flex overflow-hidden relative">
        <!-- 侧边栏 -->
        <div
            class="w-80 h-full bg-[rgba(255,255,255,0.5)] border-r border-black/[0.06] flex flex-col backdrop-blur-[20px]">
            <div class="px-6 pt-7 pb-4 flex justify-between items-center">
                <h2 class="text-2xl font-bold tracking-[-0.01em]">便签</h2>
                <button
                    class="bg-transparent border-none cursor-pointer w-9 h-9 rounded-full flex items-center justify-center text-[#0071e3] transition-all duration-200 hover:bg-[#0071e3]/10"
                    id="new-note-btn" title="新建便签">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
            <!-- 搜索框 -->
            <div class="px-4 pb-3">
                <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-[15px] h-[15px] text-[#86868b] pointer-events-none"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" placeholder="搜索便签"
                        class="w-full bg-black/[0.04] border-none rounded-xl pl-9 pr-3 py-[7px] text-[13px] text-[#1d1d1f] placeholder-[#86868b] outline-none focus:bg-black/[0.06] transition-all duration-200">
                </div>
            </div>
            <div class="flex-1 overflow-y-auto px-4 pb-4" id="note-list">
                <!-- 动态渲染项 -->
            </div>
        </div>

        <!-- 编辑工作区 -->
        <div class="flex-1 h-full bg-white/20 flex flex-col relative" id="editor-pane">
            <!-- 浮动操作栏（绝对定位在顶部，毛玻璃效果） -->
            <div id="action-bar" class="absolute top-4 right-4 z-10 bg-[rgba(255,255,255,0.75)]   hidden">
                <div class="flex justify-end gap-3 items-center">
                    <button
                        class="bg-gradient-to-r from-[#e0e7ff] to-[#ede9fe] border border-[#c7d2fe]/60 px-[18px] py-[9px] rounded-xl text-sm font-medium cursor-pointer inline-flex items-center gap-1.5 text-[#6366f1] transition-all duration-200 shadow-[0_1px_3px_rgba(99,102,241,0.08)] hover:from-[#d0d8ff] hover:to-[#ddd6fe] hover:border-[#a5b4fc]/60 hover:shadow-[0_2px_8px_rgba(99,102,241,0.15)]"
                        id="ai-summary-btn" title="AI 总结标题">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                            <path d="M2 17l10 5 10-5"></path>
                            <path d="M2 12l10 5 10-5"></path>
                        </svg>
                        AI 总结
                    </button>
                    <button
                        class="bg-white/80 border border-black/[0.06] px-[18px] py-[9px] rounded-xl text-sm font-medium cursor-pointer inline-flex items-center gap-1.5 text-[#1d1d1f] transition-all duration-200 shadow-[0_1px_3px_rgba(0,0,0,0.02)] hover:bg-white hover:border-black/10 hover:shadow-[0_2px_8px_rgba(0,0,0,0.04)]"
                        id="settings-btn" title="设置">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
                            </path>
                        </svg>
                    </button>
                    <button
                        class="bg-white/80 border border-black/[0.06] px-[18px] py-[9px] rounded-xl text-sm font-medium cursor-pointer inline-flex items-center gap-1.5 text-[#1d1d1f] transition-all duration-200 shadow-[0_1px_3px_rgba(0,0,0,0.02)] hover:bg-white hover:border-black/10 hover:shadow-[0_2px_8px_rgba(0,0,0,0.04)]"
                        id="copy-btn">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                    <button
                        class="bg-white/80 border border-black/[0.06] px-[18px] py-[9px] rounded-xl text-sm font-medium cursor-pointer inline-flex items-center gap-1.5 text-[#1d1d1f] transition-all duration-200 shadow-[0_1px_3px_rgba(0,0,0,0.02)] hover:bg-[#ff3b30] hover:text-white hover:border-[#ff3b30]"
                        id="delete-btn">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                            </path>
                        </svg>
                    </button>
                    <a href="https://mx2d.cn" target="_blank" rel="noopener noreferrer"
                        class="bg-white/80 border border-black/[0.06] px-[18px] py-[9px] rounded-xl text-sm font-medium no-underline inline-flex items-center gap-1.5 text-[#0071e3] transition-all duration-200 shadow-[0_1px_3px_rgba(0,0,0,0.02)] hover:bg-white hover:border-black/10 hover:shadow-[0_2px_8px_rgba(0,0,0,0.04)]">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                        吴文龙的主页
                    </a>
                </div>
            </div>

            <div id="active-editor" class=" h-full flex-col px-[60px] h-screen overflow-auto">
                <div class="flex-1 flex flex-col gap-4 overflow-hidden">
                    <input type="text"
                        class="text-[32px]  pt-[12px] font-bold border-none bg-transparent outline-none text-[#1d1d1f] tracking-[-0.02em] placeholder-[#c7c7cc]"
                        id="note-title" placeholder="无标题">
                    <!-- Quill 富文本挂载容器 -->
                    <div id="editor-container" class="flex-1 bg-transparent border-none flex flex-col overflow-auto">
                    </div>
                </div>
                <!-- 右下角 AI 状态与字数统计 -->
                <div
                    class="flex justify-between items-center text-[13px] text-[#86868b] absolute bottom-8 right-8 gap-4">
                    <div class="flex items-center gap-1.5" id="ai-status">
                        <span id="ai-dot" class="inline-block w-[6px] h-[6px] rounded-full bg-[#86868b]"></span>
                        <span id="ai-text">AI 总结已关闭</span>
                    </div>
                    <div id="word-count" class="ml-4">0 字</div>
                </div>
            </div>

            <div class="flex-1 h-full flex flex-col items-center justify-center text-[#86868b] gap-3" id="empty-state">
                <svg class="w-14 h-14 stroke-[1.5] text-[#c7c7cc]" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <p>未选择便签</p>
            </div>
        </div>
    </div>

    <!-- 复制成功反馈 Toast -->
    <div class="absolute bottom-10 left-1/2 -translate-x-1/2 translate-y-[100px] bg-black/80 text-white px-6 py-3 rounded-full text-sm backdrop-blur-[10px] transition-transform duration-300 ease-[cubic-bezier(0.175,0.885,0.32,1.275)] pointer-events-none z-[1000]"
        id="toast">已复制纯文本到剪贴板</div>

    <!-- 自定义提示弹窗 -->
    <div id="custom-alert"
        class="absolute inset-0 bg-black/30 backdrop-blur-[4px] flex items-center justify-center z-[300] transition-opacity duration-200 opacity-0 pointer-events-none">
        <div
            class="bg-white/95 backdrop-blur-[20px] rounded-2xl shadow-[0_8px_40px_rgba(0,0,0,0.12)] w-[320px] overflow-hidden">
            <div class="px-6 pt-6 pb-2 text-center">
                <div class="text-[15px] font-medium text-[#1d1d1f] leading-relaxed" id="custom-alert-title">提示</div>
            </div>
            <div class="px-6 pb-2 text-center">
                <div class="text-[13px] text-[#86868b] leading-relaxed" id="custom-alert-message">内容不足 10 个字，无法生成有意义的总结
                </div>
            </div>
            <div class="px-6 pb-5 pt-3 flex justify-center">
                <button id="custom-alert-ok"
                    class="bg-[#0071e3] text-white border-none px-8 py-2.5 rounded-xl text-[15px] font-medium cursor-pointer transition-all duration-200 hover:bg-[#0062cc] min-w-[120px]">
                    好的
                </button>
            </div>
        </div>
    </div>

    <!-- 设置模态框 -->
    <div id="settings-modal"
        class="absolute inset-0 bg-black/30 backdrop-blur-[4px] flex items-center justify-center z-[200] transition-opacity duration-200 opacity-0 pointer-events-none">
        <div
            class="bg-white/95 backdrop-blur-[20px] rounded-2xl shadow-[0_8px_40px_rgba(0,0,0,0.12)] w-[380px] overflow-hidden">
            <div class="px-6 pt-6 pb-4 flex justify-between items-center border-b border-black/[0.06]">
                <h3 class="text-lg font-semibold text-[#1d1d1f]">设置</h3>
                <button id="settings-close-btn"
                    class="bg-transparent border-none cursor-pointer w-7 h-7 rounded-full flex items-center justify-center text-[#86868b] hover:bg-black/5 hover:text-[#1d1d1f] transition-all duration-200">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="px-6 py-5 space-y-5">
                <!-- AI 总结标题开关 -->
                <div class="flex justify-between items-center">
                    <div>
                        <div class="text-[15px] font-medium text-[#1d1d1f]">AI 自动总结标题</div>
                        <div class="text-[13px] text-[#86868b] mt-0.5">失焦后自动调用 AI 为便签生成标题</div>
                    </div>
                    <label class="relative inline-block w-[51px] h-[31px] cursor-pointer">
                        <input type="checkbox" id="ai-summary-toggle" class="sr-only peer">
                        <span
                            class="absolute inset-0 bg-[#e9e9ea] rounded-full transition-colors duration-200 peer-checked:bg-[#34c759]"></span>
                        <span
                            class="absolute top-[2px] left-[2px] w-[27px] h-[27px] bg-white rounded-full shadow-[0_1px_3px_rgba(0,0,0,0.15)] transition-transform duration-200 peer-checked:translate-x-[20px]"></span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Quill.js 富文本编辑器 JS -->
    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
    <!-- 图片缩放模块：加载后自动注册到 window.Quill，无需手动 register -->
    <script src="https://cdn.jsdelivr.net/npm/quill-image-resize-module@3.0.0/image-resize.min.js"></script>
    <script>
        // 初始化 Quill 富文本编辑器
        const quill = new Quill('#editor-container', {
            theme: 'snow',
            placeholder: '键入富文本内容，失焦后 AI 将自动总结标题...',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline', 'strike'],
                    ['blockquote', 'code-block'],
                    [{ header: 1 }, { header: 2 }],
                    [{ list: 'ordered' }, { list: 'bullet' }],
                    [{ color: [] }, { background: [] }],
                    ['image'],
                    ['clean']
                ],
                // 图片缩放：点击图片后出现拖拽手柄
                imageResize: {}
            }
        });

        // 数据状态管理
        let notes = JSON.parse(localStorage.getItem('apple_notes_data_ai')) || [
            { id: 1, title: '欢迎使用 AI 智能便签', body: '<p>这是一个全屏无边界、集成富文本与 AI 自动总结标题的 Apple 风格应用。</p><p>尝试在此修改内容，AI 将在内容变动后自动为您生成合适的标题（1分钟最多触发一次）。</p>', updatedAt: Date.now(), pinned: false, createdAt: Date.now() }
        ];
        // 为旧数据补充 createdAt、pinned、order 字段
        notes.forEach((n, i) => {
            if (!n.createdAt) n.createdAt = n.id;
            if (n.pinned === undefined) n.pinned = false;
            if (n.order === undefined) n.order = i;
        });
        let currentNoteId = notes.length > 0 ? notes[0].id : null;
        let isInternalUpdate = false;

        // 节流控制对象：存储每个便签上一次触发 AI 总结的时间戳 { [noteId]: timestamp }
        let aiThrottleMap = {};

        // 内容变化检测：记录每个便签上次提交给 AI 的纯文本内容 { [noteId]: string }
        let lastSubmittedContent = {};

        // AI 总结进行中锁：防止并发触发
        let aiSummaryInProgress = false;

        // 用户手动修改标题标记：记录哪些便签的标题是用户手动改过的 { [noteId]: boolean }
        let manuallyTitledNotes = {};

        // DOM 元素引用
        const noteListEl = document.getElementById('note-list');
        const activeEditorEl = document.getElementById('active-editor');
        const emptyStateEl = document.getElementById('empty-state');
        const titleInputEl = document.getElementById('note-title');
        const newNoteBtn = document.getElementById('new-note-btn');
        const deleteBtn = document.getElementById('delete-btn');
        const copyBtn = document.getElementById('copy-btn');
        const toastEl = document.getElementById('toast');
        const aiStatusEl = document.getElementById('ai-status');
        const aiDotEl = document.getElementById('ai-dot');
        const aiTextEl = document.getElementById('ai-text');
        const settingsBtn = document.getElementById('settings-btn');
        const settingsCloseBtn = document.getElementById('settings-close-btn');
        const settingsModal = document.getElementById('settings-modal');
        const aiSummaryToggle = document.getElementById('ai-summary-toggle');
        const wordCountEl = document.getElementById('word-count');
        const actionBar = document.getElementById('action-bar');
        const searchInput = document.getElementById('search-input');
        // 搜索关键词（统一转小写，便于匹配）
        let searchKeyword = '';

        // 更新 AI 状态显示（dot 颜色 + 文字）
        function updateAIStatus(text, dotColor) {
            aiTextEl.textContent = text;
            if (dotColor) {
                aiDotEl.className = `inline-block w-[6px] h-[6px] rounded-full bg-[${dotColor}]`;
            }
        }

        // AI 配置（从 localStorage 读取，默认开启）
        let aiConfig = JSON.parse(localStorage.getItem('ai_config')) || { summaryEnabled: false };
        aiSummaryToggle.checked = aiConfig.summaryEnabled;

        // 保存 AI 配置
        function saveAiConfig() {
            localStorage.setItem('ai_config', JSON.stringify(aiConfig));
        }

        // 保存到本地存储
        function saveNotes() {
            localStorage.setItem('apple_notes_data_ai', JSON.stringify(notes));
        }

        // 更新字数统计
        function updateWordCount() {
            const text = quill.getText().trim();
            const count = text.length;
            wordCountEl.textContent = `${count} 字`;
        }

        // 渲染左侧列表
        function renderList() {
            noteListEl.innerHTML = '';
            // 置顶优先，然后按 order 排序（拖拽自定义顺序）
            notes.sort((a, b) => {
                if (a.pinned !== b.pinned) return b.pinned ? 1 : -1;
                return a.order - b.order;
            });

            // 搜索过滤：匹配标题或内容纯文本
            const filteredNotes = notes.filter(note => {
                if (!searchKeyword) return true;
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = note.body;
                const plainText = (tempDiv.textContent || tempDiv.innerText || '').toLowerCase();
                const titleText = (note.title || '').toLowerCase();
                return titleText.includes(searchKeyword) || plainText.includes(searchKeyword);
            });

            // 空列表提示
            if (filteredNotes.length === 0) {
                noteListEl.innerHTML = `<div class="text-center text-[13px] text-[#86868b] py-10">${searchKeyword ? '未找到匹配的便签' : '暂无便签'}</div>`;
                bindDragSort();
                renderEditor();
                return;
            }

            filteredNotes.forEach(note => {
                const item = document.createElement('div');
                const isActive = note.id === currentNoteId;
                item.className = `p-4 rounded-xl cursor-pointer mb-2 transition-all duration-200 ease-[cubic-bezier(0.25,1,0.5,1)] relative flex justify-between items-center ${isActive ? 'bg-white shadow-[0_4px_16px_rgba(0,0,0,0.04)]' : 'bg-transparent hover:bg-white/60 group'}`;
                item.draggable = true;
                item.dataset.noteId = note.id;
                item.onclick = () => selectNote(note.id);

                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = note.body;
                const plainSnippet = tempDiv.textContent || tempDiv.innerText || '';

                const pinIcon = note.pinned
                    ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none" class="text-[#ff9500] inline-block mr-1 -mt-0.5"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>`
                    : '';

                item.innerHTML = `
                    <div class="flex-1 overflow-hidden mr-2">
                        <div class="text-[15px] font-semibold text-[#1d1d1f] whitespace-nowrap overflow-hidden text-ellipsis mb-1">${pinIcon}${escapeHTML(note.title) || '无标题'}</div>
                        <div class="text-[13px] text-[#86868b] whitespace-nowrap overflow-hidden text-ellipsis">${escapeHTML(plainSnippet) || '无内容'}</div>
                    </div>
                    <div class="flex items-center gap-0.5">
                        <button class="bg-transparent border-none text-[#86868b] cursor-pointer w-7 h-7 rounded-full flex items-center justify-center transition-all duration-200 hover:bg-[#ff9500]/10 hover:text-[#ff9500] ${isActive ? 'opacity-70 hover:opacity-100' : 'opacity-0 group-hover:opacity-100'}" title="${note.pinned ? '取消置顶' : '置顶'}" onclick="togglePin(event, ${note.id})">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="${note.pinned ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>
                        </button>
                        <button class="bg-transparent border-none text-[#86868b] cursor-pointer w-7 h-7 rounded-full flex items-center justify-center transition-all duration-200 hover:bg-[#ff3b30]/10 hover:text-[#ff3b30] ${isActive ? 'opacity-70 hover:opacity-100' : 'opacity-0 group-hover:opacity-100'}" title="删除便签" onclick="deleteNoteById(event, ${note.id})">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                `;
                noteListEl.appendChild(item);
            });

            // 绑定拖拽排序事件
            bindDragSort();

            renderEditor();
        }

        // 渲染右侧编辑器视图
        function renderEditor() {
            const currentNote = notes.find(n => n.id === currentNoteId);
            if (currentNote) {
                activeEditorEl.style.display = 'flex';
                emptyStateEl.style.display = 'none';
                actionBar.classList.remove('hidden');

                if (document.activeElement !== titleInputEl) {
                    titleInputEl.value = currentNote.title;
                }

                if (quill.root.innerHTML !== currentNote.body) {
                    isInternalUpdate = true;
                    quill.root.innerHTML = currentNote.body;
                    isInternalUpdate = false;
                }
            } else {
                activeEditorEl.style.display = 'none';
                emptyStateEl.style.display = 'flex';
                actionBar.classList.add('hidden');
            }
        }

        // 切换当前便签
        function selectNote(id) {
            // 切换前，触发一次 AI 总结
            if (currentNoteId && currentNoteId !== id) {
                const currentNote = notes.find(n => n.id === currentNoteId);
                if (currentNote) {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = currentNote.body;
                    const plainText = (tempDiv.textContent || tempDiv.innerText || '').trim();
                    triggerAISummary(currentNoteId, plainText);
                }
            }
            currentNoteId = id;
            renderList();
        }

        // 新建便签
        newNoteBtn.onclick = () => {
            const now = Date.now();
            const minOrder = notes.length > 0 ? Math.min(...notes.map(n => n.order)) : 0;
            const newNote = {
                id: now,
                title: '',
                body: '',
                updatedAt: now,
                createdAt: now,
                pinned: false,
                order: minOrder - 1
            };
            notes.unshift(newNote);
            currentNoteId = newNote.id;
            saveNotes();
            renderList();
            titleInputEl.focus();
        };

        // 手动修改标题（标记为手动修改，AI 不再覆盖）
        titleInputEl.oninput = () => {
            if (!currentNoteId) return;
            const note = notes.find(n => n.id === currentNoteId);
            if (note) {
                note.title = titleInputEl.value;
                note.updatedAt = Date.now();
                // 标记此便签标题为用户手动修改
                manuallyTitledNotes[currentNoteId] = true;
                saveNotes();
                renderList();
            }
        };

        // 调用 AI 总结标题接口
        // force: true 时跳过开关检查（按钮手动触发）
        async function triggerAISummary(noteId, textContent, force = false) {
            if (!textContent.trim()) return;

            // 防止并发触发：如果上一轮 AI 总结尚未完成，直接跳过
            if (aiSummaryInProgress) return;

            // AI 开关检查：未开启且非强制触发则不执行
            if (!force && !aiConfig.summaryEnabled) {
                updateAIStatus("AI 总结已关闭", "#86868b");
                return;
            }

            // 用户手动修改过标题，且非强制触发时，AI 不覆盖
            if (!force && manuallyTitledNotes[noteId]) return;

            // 内容变化检测：与上次提交的内容比对，未变则跳过（强制触发时跳过此检查）
            if (!force && lastSubmittedContent[noteId] === textContent.trim()) return;

            const now = Date.now();
            const lastTriggerTime = aiThrottleMap[noteId] || 0;
            const cooldown = 15 * 1000; // 15秒

            // 检查冷却时间（强制触发时跳过）
            if (!force && now - lastTriggerTime < cooldown) {
                return;
            }

            // 更新冷却时间戳
            aiThrottleMap[noteId] = now;

            // 设置进行中锁
            aiSummaryInProgress = true;

            // 更新UI状态为AI处理中
            updateAIStatus("AI 正在总结标题...", "#0071e3");
            aiDotEl.className = "inline-block w-2 h-2 rounded-full ai-loading-dot";

            // AI 总结按钮进入 loading 状态
            aiSummaryBtn.classList.add('ai-btn-loading');
            aiSummaryBtn.querySelector('svg').innerHTML = '<path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z" opacity=".3"/><path d="M12 2a10 10 0 0 1 10 10h-2a8 8 0 0 0-8-8z"/>';

            // 标题输入框添加 shimmer 闪烁效果
            titleInputEl.classList.add('title-shimmer');

            try {
                const response = await fetch("/api/summarize", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ content: textContent })
                });

                const data = await response.json();

                if (data.title) {
                    const targetNote = notes.find(n => n.id === noteId);
                    if (targetNote && currentNoteId === noteId) {
                        targetNote.title = data.title;
                        targetNote.updatedAt = Date.now();
                        saveNotes();
                        if (document.activeElement !== titleInputEl) {
                            titleInputEl.value = targetNote.title;
                        }
                        renderList();
                    }
                    // 记录本次提交的内容
                    lastSubmittedContent[noteId] = textContent.trim();
                }

                if (data.error) {
                    updateAIStatus("AI 服务开小差了", "#ff3b30");
                } else {
                    updateAIStatus("AI 标题更新成功", "#34c759");
                    setTimeout(() => {
                        if (aiTextEl.textContent === "AI 标题更新成功") {
                            updateAIStatus("AI 就绪", "#34c759");
                        }
                    }, 3000);
                }

            } catch (error) {
                console.error("AI 总结失败:", error);
                updateAIStatus("AI 服务开小差了", "#ff3b30");
            } finally {
                // 释放进行中锁
                aiSummaryInProgress = false;

                // 恢复 AI 总结按钮
                aiSummaryBtn.classList.remove('ai-btn-loading');
                aiSummaryBtn.querySelector('svg').innerHTML = '<path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path>';

                // 移除标题 shimmer 效果
                titleInputEl.classList.remove('title-shimmer');
            }
        }

        // 富文本内容修改同步 (Quill 监听) — 仅同步数据，不触发 AI
        quill.on('text-change', () => {
            if (isInternalUpdate || !currentNoteId) return;
            const note = notes.find(n => n.id === currentNoteId);
            if (note) {
                const newBody = quill.root.innerHTML;
                note.body = newBody;
                note.updatedAt = Date.now();
                saveNotes();
                renderList();
                updateWordCount();
            }
        });

        // 编辑器失焦触发 AI 总结（focusout + relatedTarget 避免工具栏误触）
        quill.root.addEventListener('focusout', (event) => {
            // 如果焦点移到了 Quill 工具栏内，不触发 AI
            const toolbar = document.querySelector('.ql-toolbar');
            if (toolbar && toolbar.contains(event.relatedTarget)) {
                return;
            }
            // 如果是程序内部操作导致失焦，不触发
            if (isInternalUpdate || !currentNoteId) return;

            const note = notes.find(n => n.id === currentNoteId);
            if (note) {
                // 先从 Quill 实时读取当前内容（避免 text-change 尚未同步）
                const currentBody = quill.root.innerHTML;
                note.body = currentBody;
                note.updatedAt = Date.now();
                saveNotes();

                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = currentBody;
                const plainText = (tempDiv.textContent || tempDiv.innerText || '').trim();

                triggerAISummary(currentNoteId, plainText);
            }
        });

        // ========== 拖拽排序 ==========
        let dragSourceId = null;
        let dropIndicatorEl = null;

        function bindDragSort() {
            const items = noteListEl.querySelectorAll('[data-note-id]');

            items.forEach(item => {
                item.addEventListener('dragstart', onDragStart);
                item.addEventListener('dragend', onDragEnd);
                item.addEventListener('dragover', onDragOver);
                item.addEventListener('drop', onDrop);
            });
        }

        function onDragStart(event) {
            dragSourceId = this.dataset.noteId;
            this.classList.add('note-item-dragging');
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', dragSourceId);
        }

        function onDragEnd() {
            this.classList.remove('note-item-dragging');
            dragSourceId = null;
            removeDropIndicator();
        }

        function onDragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';

            const targetId = this.dataset.noteId;
            if (targetId === dragSourceId) return;

            // 显示放置指示线
            const rect = this.getBoundingClientRect();
            const midY = rect.top + rect.height / 2;
            const isBefore = event.clientY < midY;

            removeDropIndicator();
            dropIndicatorEl = document.createElement('div');
            dropIndicatorEl.className = 'note-drop-indicator';

            if (isBefore) {
                this.parentNode.insertBefore(dropIndicatorEl, this);
            } else {
                this.parentNode.insertBefore(dropIndicatorEl, this.nextSibling);
            }
        }

        function onDrop(event) {
            event.preventDefault();
            removeDropIndicator();

            const targetId = this.dataset.noteId;
            if (!dragSourceId || targetId === dragSourceId) return;

            const sourceNote = notes.find(n => String(n.id) === String(dragSourceId));
            const targetNote = notes.find(n => String(n.id) === String(targetId));
            if (!sourceNote || !targetNote) return;

            // 不允许跨置顶/非置顶拖拽（置顶区与非置顶区保持分离）
            if (sourceNote.pinned !== targetNote.pinned) return;

            // 计算放置位置（上半部分=插入目标前，下半部分=插入目标后）
            const rect = this.getBoundingClientRect();
            const midY = rect.top + rect.height / 2;
            const isBefore = event.clientY < midY;

            // 重新排列 notes 数组
            // 先按当前 order 排序
            notes.sort((a, b) => {
                if (a.pinned !== b.pinned) return b.pinned ? 1 : -1;
                return a.order - b.order;
            });

            // 从数组中移除源便签
            const sourceIdx = notes.findIndex(n => n.id === sourceNote.id);
            notes.splice(sourceIdx, 1);

            // 找到目标位置
            let targetIdx = notes.findIndex(n => n.id === targetNote.id);
            if (!isBefore) targetIdx += 1;

            // 插入到目标位置
            notes.splice(targetIdx, 0, sourceNote);

            // 重新计算 order 值
            notes.forEach((n, i) => { n.order = i; });

            saveNotes();
            renderList();
        }

        function removeDropIndicator() {
            if (dropIndicatorEl && dropIndicatorEl.parentNode) {
                dropIndicatorEl.parentNode.removeChild(dropIndicatorEl);
            }
            dropIndicatorEl = null;
        }

        // 列表侧边栏置顶切换
        function togglePin(event, id) {
            event.stopPropagation();
            const note = notes.find(n => n.id === id);
            if (note) {
                note.pinned = !note.pinned;
                saveNotes();
                renderList();
            }
        }

        // 列表侧边栏直接删除
        function deleteNoteById(event, id) {
            event.stopPropagation();
            notes = notes.filter(n => n.id !== id);
            if (currentNoteId === id) {
                currentNoteId = notes.length > 0 ? notes[0].id : null;
            }
            saveNotes();
            renderList();
        }

        // 编辑区删除按钮
        deleteBtn.onclick = () => {
            if (!currentNoteId) return;
            notes = notes.filter(n => n.id !== currentNoteId);
            currentNoteId = notes.length > 0 ? notes[0].id : null;
            saveNotes();
            renderList();
        };

        // 一键复制纯文本
        copyBtn.onclick = () => {
            const currentNote = notes.find(n => n.id === currentNoteId);
            if (!currentNote) return;

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = currentNote.body;
            const pureText = tempDiv.textContent || tempDiv.innerText || '';

            const contentToCopy = `${currentNote.title}\n\n${pureText}`;
            navigator.clipboard.writeText(contentToCopy).then(() => {
                showToast();
            });
        };

        // 弹窗提示
        function showToast() {
            toastEl.classList.add('show');
            setTimeout(() => {
                toastEl.classList.remove('show');
            }, 2000);
        }

        // HTML 转义防注入工具
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g,
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // ========== 图片上传功能 ==========

        // 加载图片文件为 HTMLImageElement
        function loadImageEl(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
                img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
                img.src = url;
            });
        }

        // 将图片转换为 WebP 格式以减小存储体积
        // SVG（矢量）与 GIF（动画）保留原格式，避免转换副作用
        async function convertToWebp(file, quality = 0.85) {
            if (file.type === 'image/svg+xml' || file.type === 'image/gif' || file.type === 'image/webp') {
                return file;
            }
            try {
                const img = await loadImageEl(file);
                // 超大图等比缩放，避免 canvas 溢出并进一步压缩
                const MAX_DIMENSION = 4096;
                let w = img.naturalWidth;
                let h = img.naturalHeight;
                if (w > MAX_DIMENSION || h > MAX_DIMENSION) {
                    const scale = MAX_DIMENSION / Math.max(w, h);
                    w = Math.round(w * scale);
                    h = Math.round(h * scale);
                }
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/webp', quality));
                if (!blob) return file;
                const baseName = (file.name || 'image').replace(/\.[^.]+$/, '');
                return new File([blob], `${baseName}.webp`, { type: 'image/webp' });
            } catch (e) {
                console.error('WebP 转换失败，回退原文件:', e);
                return file;
            }
        }

        // 限制新插入图片显示宽度：若自然宽度超过编辑器容器一半，则缩至一半
        function constrainInsertedImage(url) {
            const probe = new Image();
            probe.onload = () => {
                const containerWidth = quill.root.clientWidth;
                const halfWidth = Math.round(containerWidth / 2);
                if (halfWidth > 0 && probe.naturalWidth > halfWidth) {
                    const target = quill.root.querySelector(`img[src="${url}"]`);
                    if (target) {
                        target.style.width = halfWidth + 'px';
                        target.style.height = 'auto';
                        // style 变更不触发 Quill text-change，手动同步保存
                        if (!currentNoteId) return;
                        const note = notes.find(n => n.id === currentNoteId);
                        if (note) {
                            note.body = quill.root.innerHTML;
                            note.updatedAt = Date.now();
                            saveNotes();
                        }
                    }
                }
            };
            probe.onerror = () => { /* 探测失败则保持原尺寸 */ };
            probe.src = url;
        }

        // 通用图片上传函数：接收 File/Blob 对象，上传到服务器并插入 Quill
        async function uploadImageToServer(file) {
            // 转换为 WebP 格式（SVG/GIF 保留原格式）
            const uploadFile = await convertToWebp(file);

            const formData = new FormData();
            formData.append('image', uploadFile);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.url) {
                    const range = quill.getSelection(true);
                    quill.insertEmbed(range.index, 'image', data.url);
                    quill.setSelection(range.index + 1);
                    // 超大图缩至容器一半，仍可拖拽手柄调整
                    constrainInsertedImage(data.url);
                } else {
                    showToastMsg(data.error || '图片上传失败');
                }
            } catch (error) {
                console.error('图片上传失败:', error);
                showToastMsg('图片上传失败');
            }
        }

        // 自定义 Quill image handler：点击工具栏图片按钮
        function imageUploadHandler() {
            const input = document.createElement('input');
            input.setAttribute('type', 'file');
            input.setAttribute('accept', 'image/*');
            input.click();

            input.onchange = () => {
                const file = input.files[0];
                if (file) {
                    uploadImageToServer(file);
                }
            };
        }

        // 注册自定义 image handler
        const toolbarModule = quill.getModule('toolbar');
        toolbarModule.addHandler('image', imageUploadHandler);

        // 粘贴图片支持
        quill.root.addEventListener('paste', (event) => {
            const items = event.clipboardData?.items;
            if (!items) return;

            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                if (item.type.startsWith('image/')) {
                    event.preventDefault();
                    const file = item.getAsFile();
                    if (file) {
                        uploadImageToServer(file);
                    }
                    break;
                }
            }
        });

        // 拖拽图片支持
        quill.root.addEventListener('drop', (event) => {
            const files = event.dataTransfer?.files;
            if (!files || files.length === 0) return;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (file.type.startsWith('image/')) {
                    event.preventDefault();
                    uploadImageToServer(file);
                    break;
                }
            }
        });

        // Toast 消息提示（复用已有 toast 元素）
        function showToastMsg(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            setTimeout(() => {
                toastEl.classList.remove('show');
                // 恢复默认文本
                setTimeout(() => { toastEl.textContent = '已复制纯文本到剪贴板'; }, 300);
            }, 2000);
        }

        // ========== AI 总结按钮 ==========
        const aiSummaryBtn = document.getElementById('ai-summary-btn');
        aiSummaryBtn.onclick = () => {
            if (!currentNoteId) return;
            // 防止进行中重复触发
            if (aiSummaryInProgress) {
                showToastMsg('AI 总结进行中，请稍候');
                return;
            }
            const note = notes.find(n => n.id === currentNoteId);
            if (!note) return;

            // 检查内容
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = note.body;
            const plainText = (tempDiv.textContent || tempDiv.innerText || '').trim();

            if (!plainText) {
                showCustomAlert('无法总结', '便签内容为空，请先输入内容后再使用 AI 总结');
                return;
            }

            if (plainText.length < 10) {
                showCustomAlert('内容太短', '当前仅 ' + plainText.length + ' 个字，至少需要 10 个字才能生成有意义的总结');
                return;
            }

            // 强制触发：跳过开关、节流、内容比对、手动标题标记
            triggerAISummary(currentNoteId, plainText, true);
        };

        // ========== 自定义提示弹窗 ==========
        const customAlertEl = document.getElementById('custom-alert');
        const customAlertTitleEl = document.getElementById('custom-alert-title');
        const customAlertMessageEl = document.getElementById('custom-alert-message');
        const customAlertOkBtn = document.getElementById('custom-alert-ok');

        function showCustomAlert(title, message) {
            customAlertTitleEl.textContent = title;
            customAlertMessageEl.textContent = message;
            customAlertEl.classList.remove('opacity-0', 'pointer-events-none');
            customAlertEl.classList.add('opacity-100', 'pointer-events-auto');
        }

        function closeCustomAlert() {
            customAlertEl.classList.remove('opacity-100', 'pointer-events-auto');
            customAlertEl.classList.add('opacity-0', 'pointer-events-none');
        }

        customAlertOkBtn.onclick = closeCustomAlert;
        customAlertEl.onclick = (event) => {
            if (event.target === customAlertEl) closeCustomAlert();
        };

        // ========== 设置模态框交互 ==========

        function openSettings() {
            settingsModal.classList.remove('opacity-0', 'pointer-events-none');
            settingsModal.classList.add('opacity-100', 'pointer-events-auto');
        }

        function closeSettings() {
            settingsModal.classList.remove('opacity-100', 'pointer-events-auto');
            settingsModal.classList.add('opacity-0', 'pointer-events-none');
        }

        settingsBtn.onclick = openSettings;
        settingsCloseBtn.onclick = closeSettings;

        // 点击模态框背景关闭
        settingsModal.onclick = (event) => {
            if (event.target === settingsModal) closeSettings();
        };

        // AI 总结开关切换
        aiSummaryToggle.onchange = () => {
            aiConfig.summaryEnabled = aiSummaryToggle.checked;
            saveAiConfig();
            if (aiConfig.summaryEnabled) {
                updateAIStatus("AI 就绪", "#34c759");
            } else {
                updateAIStatus("AI 总结已关闭", "#86868b");
            }
        };

        // 初始化 AI 状态显示
        if (aiConfig.summaryEnabled) {
            updateAIStatus("AI 就绪", "#34c759");
        } else {
            updateAIStatus("AI 总结已关闭", "#86868b");
        }

        // 启动时自动移除空标题且空内容的便签
        const beforeCount = notes.length;
        notes = notes.filter(n => {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = n.body;
            const plainText = (tempDiv.textContent || tempDiv.innerText || '').trim();
            const titleText = (n.title || '').trim();
            return titleText || plainText; // 保留至少有标题或内容的便签
        });
        if (notes.length !== beforeCount) {
            saveNotes();
            // 若当前选中的便签已被清理，切换到第一个
            if (currentNoteId && !notes.find(n => n.id === currentNoteId)) {
                currentNoteId = notes.length > 0 ? notes[0].id : null;
            }
        }

        // ========== 搜索过滤 ==========
        searchInput.oninput = () => {
            searchKeyword = searchInput.value.trim().toLowerCase();
            renderList();
        };

        // 初始化运行
        renderList();
        updateWordCount();
    </script>
</body>

</html>
